media:
  input: src/assets/articles
  output: ../../assets/articles

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    format: yaml-frontmatter

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: author
        label: Author
        type: string
        default: Krishna Pal

      - name: category
        label: Category
        type: select
        options:
          values:
            - Finance
            - Economics
            - Indian Banking
            - Taxation
            - History

      - name: tags
        label: Tags
        type: string
        list: true

      - name: featuredImage
        label: Featured Image
        type: image

      - name: publishDate
        label: Publish Date
        type: date
        options:
          foramt: "dd-MM-yyyy"

      - name: updatedDate
        label: Updated Date
        type: date
        options:
          foramt: "dd-MM-yyyy"

      - name: editorialStatus
        label: Editorial Status
        type: select
        options:
          values:
            - none
            - minor
            - major
            - retraction

      - name: updateReason
        label: Update Reason
        type: text

      - name: featured
        label: Featured Article
        type: boolean

      - name: draft
        label: Draft
        type: boolean

      - name: body
        label: Article
        type: rich-text

  - name: homepage
    label: Homepage Configuration
    type: file
    path: src/content/homepage/config.yml
    format: yaml

    fields:
      - name: subjectLinks
        label: Subject Links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Subject
            type: string
            required: true

          - name: href
            label: Category URL
            type: string
            required: true

      - name: collections
        label: Curated Article Collections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Collection Title
            type: string
            required: true

          - name: description
            label: Description
            type: text

          - name: visible
            label: Show on Homepage
            type: boolean

          - name: featured
            label: Featured Series
            type: boolean

          - name: articles
            label: Articles in Display Order
            type: reference
            options:
              collection: articles
              multiple: true
              value: "{path}"
              label: "{primary}"
